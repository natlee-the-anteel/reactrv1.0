name: Test macOS Install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-setup:
    runs-on: macos-14   # Apple Silicon (arm64) hosted runner
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l {0}   # login shell so conda activation persists across steps

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run setup.sh
        run: bash setup.sh

      - name: Verify key binaries are on PATH
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$GITHUB_WORKSPACE/preset:$PATH"
          source "$CONDA_BASE/etc/profile.d/conda.sh"
          conda activate reactr
          which snakemake
          which diamond
          which iqtree
          which meme
          which preset/MCScanX || echo "MCScanX check path may need adjustment"
